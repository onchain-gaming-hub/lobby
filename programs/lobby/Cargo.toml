[package]
name = "lobby"
version = "0.1.0"
description = "lobby — rooms / matchmaking / readyCheck / rematch for blockchain-games-hub (specs/designs/)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "lobby"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-account = "4.7.0"
base64 = "0.22.1"
serde_json = "1"
mock_game = { path = "../../tests/mock-game", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
